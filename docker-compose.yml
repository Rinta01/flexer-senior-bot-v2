services:
  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: sqlite+aiosqlite:////app/data/flexer_senior.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WEEKLY_DUTY_ENABLED: ${WEEKLY_DUTY_ENABLED:-true}
      WEEKLY_DUTY_DAY: ${WEEKLY_DUTY_DAY:-6}
      WEEKLY_DUTY_TIME: ${WEEKLY_DUTY_TIME:-15:00}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./pyproject.toml
